plugins {
    id 'com.android.application'
}

android {
    namespace 'com.streambert.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.streambert.mobile"
        minSdk 23
        targetSdk 34
        versionCode 30
        versionName "1.0.6"
    }

    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../java']
            res.srcDirs = ['../res']
            assets.srcDirs = ['../assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Media3 (ExoPlayer + Cast)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'
    implementation 'androidx.media3:media3-datasource:1.4.1'
    implementation 'androidx.media3:media3-container:1.4.1'
    implementation 'androidx.media3:media3-extractor:1.4.1'
    implementation 'androidx.media3:media3-database:1.4.1'
    implementation 'androidx.media3:media3-decoder:1.4.1'
    implementation 'androidx.media3:media3-cast:1.4.1'

    // WorkManager for reliable background downloads
    implementation 'androidx.work:work-runtime:2.9.0'

    // AndroidX core
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'androidx.collection:collection:1.3.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    // Local AARs/JARs (none needed now; all deps via Maven)
}