name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.0.5)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "name=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > streambert-android/streambert-release.keystore
            echo "Using keystore from repository secret"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret found, using committed keystore"
          fi

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: |
          cd streambert-android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew 2>/dev/null || true
          gradle assembleRelease --no-daemon
          # Sign with release keystore
          KS=streambert-release.keystore
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $KS
          fi
          KS_PASS="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}"
          [ -z "$KS_PASS" ] && KS_PASS="streambert-release"
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          java -jar $ANDROID_HOME/build-tools/$BT/lib/apksigner.jar sign \
            --ks $KS --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS \
            --ks-key-alias streambert \
            --out Streambert-Mobile.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK
        run: |
          ls -lh streambert-android/Streambert-Mobile.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Streambert Mobile v${{ steps.version.outputs.name }}
          files: streambert-android/Streambert-Mobile.apk
          body: |
            ## Streambert Mobile v${{ steps.version.outputs.name }}

            Automated build from GitHub Actions.

            ### APK
            - Signed with release keystore
            - Min SDK: 23 (Android 6.0)
            - Target SDK: 34 (Android 14)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}